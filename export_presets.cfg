; One preset per store and platform. Store differences come from feature tags
; (custom_features), never from separate code: "steam" switches the Platform
; autoload to the Steam backend. Add a store by adding presets here plus a
; PlatformBackend subclass.

[preset.0]

name="Windows (itch)"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="itch"
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*, tools/*"
export_path="build/itch/windows/HeroicShopkeep.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
application/product_name="Heroic Shopkeep"

